<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rincón Santo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <div class="login-container">
    <h2>📝 Bienvenido a Rincón Santo</h2>
    
    <!-- Formulario correo y contraseña -->
    <form id="login-form">
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit"><i class="fas fa-right-to-bracket"></i> Iniciar Sesión</button>
    </form>

    <!-- Crear cuenta manual -->
    <button id="signup-btn"><i class="fas fa-user-plus"></i> Crear Cuenta</button>

    <!-- Login Google -->
    <div class="social-login">
      <button id="google-login"><i class="fab fa-google"></i> Iniciar con Google</button>
    </div>

    <p id="error-msg" class="error-msg"></p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
